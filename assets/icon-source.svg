<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#1F4E79"/>

  <!-- Back card -->
  <g transform="rotate(7 512 500)">
    <rect x="252" y="300" width="520" height="400" rx="40" fill="#E7EEF4" opacity="0.45"/>
  </g>

  <!-- Front card shadow -->
  <g transform="translate(0 18) rotate(-6 512 500)">
    <rect x="252" y="300" width="520" height="400" rx="40" fill="#153A5A"/>
  </g>

  <!-- Front card -->
  <g transform="rotate(-6 512 500)">
    <rect x="252" y="300" width="520" height="400" rx="40" fill="#F6F4EF"/>

    <!-- T monogram -->
    <rect x="402" y="392" width="220" height="52" rx="10" fill="#1F4E79"/>
    <rect x="486" y="424" width="52" height="190" rx="10" fill="#1F4E79"/>

    <!-- Swipe rule -->
    <rect x="402" y="646" width="220" height="10" rx="5" fill="#CFC8B8"/>
  </g>
</svg>
